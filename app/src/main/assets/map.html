<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="leaflet.css"/>
<script src="leaflet.js"></script>
<style>
html, body, #map { height: 100%; margin: 0; background: #eef3f1; font-family: sans-serif; }
body.dark, body.dark #map { background: #1b211e; }
body.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9); }
.leaflet-popup-content-wrapper { border-radius: 14px; }
.popup-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #141f1c; }
.popup-note { font-size: 14px; color: #2b3a35; white-space: pre-wrap; }
.popup-meta { font-size: 12px; color: #5b6b65; margin-top: 8px; }
</style>
</head>
<body>
<div id="map"></div>
<script>
// Mac dinh o Seoul; ban do tu can lai theo vi tri hien tai va cac diem da luu.
var map = L.map('map', { zoomControl: true }).setView([37.5665, 126.9780], 12);

// Tile OpenStreetMap chuan: mien phi, khong can API key.
// (CARTO basemaps tra ve anh "API KEY REQUIRED" voi HTTP 200 khi goi tu WebView, nen khong dung nua.)
// Khong dung endpoint noi bo cua Google (vi pham dieu khoan va co the bi chan bat cu luc nao).
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).on('tileerror', function (e) {
  console.log('Tile error: ' + (e.tile && e.tile.src));
}).addTo(map);

// Che do toi: dao mau lop tile bang CSS (OSM khong co ban toi chinh thuc), marker khong bi anh huong.
function setTheme(dark) {
  document.body.className = dark ? 'dark' : 'light';
}
setTheme(false);

var noteLayer = L.layerGroup().addTo(map);
var meLayer = L.layerGroup().addTo(map);

// Trong WebView, chieu cao 100% cua #map khong phai luc nao cung tinh ra duoc
// (do ra 0px) nen ban do khong ve gi ca. Gan cung theo chieu cao viewport.
function fitMapToWindow() {
  if (window.innerHeight > 0) {
    document.getElementById('map').style.height = window.innerHeight + 'px';
  }
  map.invalidateSize();
}
fitMapToWindow();
window.addEventListener('error', function (e) { console.log('JS error: ' + e.message); });

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// Duoc Android goi sau khi trang load xong. payload: {dark, me:{lat,lng}|null, notes:[...]}
function renderNotes(payload) {
  setTheme(!!payload.dark);
  // WebView thuong chua co kich thuoc that khi Leaflet khoi tao -> phai do lai,
  // neu khong ban do trong tron khong ve tile nao ca.
  fitMapToWindow();

  noteLayer.clearLayers();
  meLayer.clearLayers();

  var bounds = [];

  if (payload.me) {
    L.circleMarker([payload.me.lat, payload.me.lng], {
      radius: 8, color: '#ffffff', weight: 2, fillColor: '#4285F4', fillOpacity: 1
    }).addTo(meLayer).bindPopup('Vị trí hiện tại của bạn');
    bounds.push([payload.me.lat, payload.me.lng]);
  }

  payload.notes.forEach(function (n) {
    L.circle([n.lat, n.lng], {
      radius: n.radius, color: '#126d4f', weight: 1, fillColor: '#126d4f', fillOpacity: 0.08
    }).addTo(noteLayer);

    L.circleMarker([n.lat, n.lng], {
      radius: 11, color: '#ffffff', weight: 3, fillColor: '#126d4f', fillOpacity: 1
    }).addTo(noteLayer).bindPopup(
      '<div class="popup-title">' + esc(n.name) + '</div>' +
      '<div class="popup-note">' + esc(n.note) + '</div>' +
      '<div class="popup-meta">Bán kính nhắc: ' + n.radius + 'm</div>'
    );

    bounds.push([n.lat, n.lng]);
  });

  if (bounds.length === 1) {
    map.setView(bounds[0], 16);
  } else if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 17 });
  }
}
window.addEventListener('resize', fitMapToWindow);
</script>
</body>
</html>
